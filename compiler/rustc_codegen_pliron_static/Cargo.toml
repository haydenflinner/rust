[package]
name = "rustc_codegen_pliron_static"
version = "0.1.0"
edition = "2024"

# Statically linked pliron backend for hosts without dylibs (wasm).
[lib]
name = "rustc_codegen_pliron"
path = "../rustc_codegen_pliron/src/lib.rs"
doctest = false

[dependencies]
rustc_abi = { path = "../rustc_abi" }
rustc_apfloat = "0.2.0"
rustc_attr_ir = { path = "../rustc_attr_ir" }
rustc_ast = { path = "../rustc_ast" }
rustc_codegen_ssa = { path = "../rustc_codegen_ssa" }
rustc_const_eval = { path = "../rustc_const_eval" }
rustc_data_structures = { path = "../rustc_data_structures" }
rustc_errors = { path = "../rustc_errors" }
rustc_hir = { path = "../rustc_hir" }
rustc_middle = { path = "../rustc_middle" }
rustc_session = { path = "../rustc_session" }
rustc_span = { path = "../rustc_span" }
rustc_symbol_mangling = { path = "../rustc_symbol_mangling" }
rustc_target = { path = "../rustc_target" }
rsasm = { version = "0.1.3", default-features = false, features = ["x86", "aarch64"] }
gimli = { version = "0.33", default-features = false, features = ["std", "write"] }
pliron = { path = "../rustc_codegen_pliron/vendor/pliron", default-features = false, features = ["std"] }
pliron-llvm = { path = "../rustc_codegen_pliron/vendor/pliron/pliron-llvm", default-features = false, features = ["std"] }
cranelift-codegen = { version = "0.135.5", default-features = false, features = ["std", "unwind", "x86", "arm64"] }
cranelift-frontend = "0.135.5"
cranelift-module = "0.135.5"
cranelift-object = "0.135.5"
target-lexicon = "0.13"
object = { version = "0.39", default-features = false, features = ["std", "read_core", "write", "elf"] }
smallvec = "1"
waffle = "0.3.2"
